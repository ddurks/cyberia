name: Deploy Frontend to S3 + CloudFront

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-2

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Get AWS account ID
        id: aws
        run: echo "account-id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Deploy to S3
        run: |
          BUCKET_NAME="cyberia-drawvid-frontend-${{ steps.aws.outputs.account-id }}"
          aws s3 sync dist/ "s3://$BUCKET_NAME/" --delete --cache-control "public, max-age=3600"
          echo "✅ Deployed to S3: $BUCKET_NAME"

      - name: Invalidate CloudFront
        run: |
          DIST_ID="E2CCOO5NN3Z8QV"
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*" --query 'Invalidation.Id' --output text)
          echo "✅ CloudFront invalidation created: $INVALIDATION_ID"

      - name: Deployment summary
        run: |
          echo "🚀 Frontend deployment complete!"
          echo "URL: https://cyberia.drawvid.com"
          echo "CloudFront cache will be refreshed in 1-2 minutes"
