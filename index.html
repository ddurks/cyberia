<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' ws: wss: http: https:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self';"
    />
    <title>cyberia</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="three-canvas"></canvas>
    </div>
    <div id="hud-container">
      <div id="online-status" class="offline">
        <span id="status-text">offline</span>
      </div>
      <img id="vibe-gif" src="assets/vibe.gif" alt="vibing" />
      <img id="hud-base" src="assets/hud/cyberia_gamepad.png" alt="HUD" />
      <div id="hud-overlay">
        <img
          id="button-a"
          class="hud-button"
          src="assets/hud/cyberia_abutton.png"
          alt="A"
        />
        <img
          id="button-b"
          class="hud-button"
          src="assets/hud/cyberia_bbutton.png"
          alt="B"
        />
        <div id="joystickWrapper1"></div>
      </div>
      <div id="left-controls"></div>
    </div>
    <div id="loading-bg"></div>
    <img id="loading" src="assets/cyberia_loading.gif" />
    <script type="module" src="src/index.js"></script>
  </body>
</html>
